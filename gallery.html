<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Casa Soledad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Lightbox */
.lightbox-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(20,14,12,0.93);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.lightbox-overlay.active { display: flex; }

.lightbox-img-wrap {
  position: relative;
  max-width: 92vw;
  max-height: 82vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox-img-wrap img {
  max-width: 92vw;
  max-height: 82vh;
  object-fit: contain;
  border-radius: 10px;
  box-shadow: 0 8px 48px rgba(0,0,0,0.6);
}

.lightbox-caption {
  color: #C9BEB1;
  font-family: "Inter", sans-serif;
  font-size: 0.9rem;
  margin-top: 16px;
  text-align: center;
}

.lightbox-close {
  position: fixed;
  top: 20px;
  right: 24px;
  background: none;
  border: none;
  color: #FFFDF9;
  font-size: 2rem;
  cursor: pointer;
  line-height: 1;
  padding: 8px;
  opacity: 0.8;
  transition: opacity 0.2s;
}
.lightbox-close:hover { opacity: 1; }

.lightbox-prev,
.lightbox-next {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,253,249,0.12);
  border: 1.5px solid rgba(255,253,249,0.25);
  color: #FFFDF9;
  font-size: 1.5rem;
  cursor: pointer;
  padding: 14px 18px;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
}
.lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,253,249,0.22); }
.lightbox-prev { left: 16px; }
.lightbox-next { right: 16px; }

.gallery-grid img {
  cursor: zoom-in;
  transition: transform 0.2s, box-shadow 0.2s;
}
.gallery-grid img:hover {
  transform: scale(1.03);
  box-shadow: 0 4px 24px rgba(44,36,32,0.18);
}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="wordmark">Casa Soledad</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="availability.html">Availability</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="page-head wrap">
  <p class="section-eyebrow">A look inside</p>
  <h1>Gallery</h1>
  <p class="page-head-sub">Click any photo to enlarge. Every room at Casa Soledad, room by room.</p>
</section>

<section class="gallery-section wrap">
  <h3 class="gallery-group-title">Living &amp; kitchen</h3>
  <div class="gallery-grid">
    <img src="images/living-room-1.jpg" alt="Main living room with sectional sofa and brick TV nook">
    <img src="images/living-kitchen.jpg" alt="Open living and kitchen with talavera tile backsplash">
    <img src="images/living-room-2.jpg" alt="Living room with beamed ceiling and ceiling fan">
    <img src="images/living-dining.jpg" alt="Living and dining area with woven yellow armchair">
    <img src="images/kitchen-1.jpg" alt="Kitchen with talavera tile and dining nook">
    <img src="images/kitchen-2.jpg" alt="Kitchen counter and gas range">
    <img src="images/kitchen-3.jpg" alt="Kitchen with stainless appliances and wood cabinetry">
    <img src="images/entryway.jpg" alt="Entry hallway with mosaic tile floor medallion">
  </div>

  <h3 class="gallery-group-title">Bedrooms &amp; baths</h3>
  <div class="gallery-grid">
    <img src="images/bedroom-1.jpg" alt="Bedroom with gold curtains and garden view">
    <img src="images/bedroom-2.jpg" alt="Bedroom with leather headboard and built-in nightstand">
    <img src="images/bedroom-3.jpg" alt="Bedroom with woven curtain wardrobe and patterned rugs">
    <img src="images/bedroom-4.jpg" alt="Bedroom suite adjoining bathroom">
    <img src="images/bedroom-kids-1.jpg" alt="Twin and bunk bed room in yellow linens">
    <img src="images/bedroom-kids-2.jpg" alt="Bunk bed room with blue patterned rug">
    <img src="images/bathroom-1.jpg" alt="Bathroom with talavera sink and walk-in shower">
    <img src="images/bathroom-2.jpg" alt="Bathroom with wood vanity and tiled shower">
    <img src="images/powder-room.jpg" alt="Powder room with patterned tile accent wall">
  </div>

  <h3 class="gallery-group-title">Outdoor &amp; rooftop</h3>
  <div class="gallery-grid">
    <img src="images/exterior-front.jpg" alt="Front exterior with palapa shade structures">
    <img src="images/rooftop-1.jpg" alt="Rooftop terrace with dining table and spiral staircase">
    <img src="images/rooftop-2.jpg" alt="Rooftop terrace with ocean visible in the distance">
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox-overlay" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lightbox-prev" id="lbPrev" aria-label="Previous photo">&#8592;</button>
  <div class="lightbox-img-wrap">
    <img id="lbImg" src="" alt="">
  </div>
  <p class="lightbox-caption" id="lbCaption"></p>
  <button class="lightbox-next" id="lbNext" aria-label="Next photo">&#8594;</button>
</div>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>Casa Soledad &middot; Todos Santos, BCS</span>
    <a href="contact.html">alexanderdlusk@gmail.com</a>
  </div>
</footer>

<script>
const overlay = document.getElementById("lightbox");
const lbImg   = document.getElementById("lbImg");
const lbCap   = document.getElementById("lbCaption");
const lbClose = document.getElementById("lbClose");
const lbPrev  = document.getElementById("lbPrev");
const lbNext  = document.getElementById("lbNext");

// Collect all gallery images in order
const allImgs = Array.from(document.querySelectorAll(".gallery-grid img"));
let current = 0;

function open(index) {
  current = index;
  const img = allImgs[current];
  lbImg.src = img.src;
  lbImg.alt = img.alt;
  lbCap.textContent = img.alt;
  overlay.classList.add("active");
  document.body.style.overflow = "hidden";
  lbClose.focus();
}

function close() {
  overlay.classList.remove("active");
  document.body.style.overflow = "";
}

function prev() { open((current - 1 + allImgs.length) % allImgs.length); }
function next() { open((current + 1) % allImgs.length); }

allImgs.forEach((img, i) => img.addEventListener("click", () => open(i)));
lbClose.addEventListener("click", close);
lbPrev.addEventListener("click", prev);
lbNext.addEventListener("click", next);
overlay.addEventListener("click", e => { if (e.target === overlay) close(); });

document.addEventListener("keydown", e => {
  if (!overlay.classList.contains("active")) return;
  if (e.key === "Escape")      close();
  if (e.key === "ArrowLeft")   prev();
  if (e.key === "ArrowRight")  next();
});
</script>

</body>
</html>
